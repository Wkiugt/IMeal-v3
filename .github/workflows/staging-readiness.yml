name: staging-readiness

on:
  pull_request:
  push:
    branches:
      - deploy/develop
      - deploy/staging
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Explicitly qualify the protected ephemeral staging target
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  YARN_VERSION: '4.18.0'
  CI: 'true'
  CI_DOCKER_AUTHORIZED: 'true'
  RELEASE_ID: imeal-${{ github.run_id }}-${{ github.sha }}
  TRIVY_IMAGE: aquasec/trivy@sha256:fa9a2d2a839e69bfc0e774e885c526b5db20dc1feba5bcd1bfb59e51e7855ae0

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          test "$(corepack yarn --version)" = "${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/static"
          node scripts/ci/checks.mjs --lane static --output "$RUNNER_TEMP/ci/static"
          node scripts/ci/ci-dispatcher.mjs --release-id "$RELEASE_ID" --lane-id static --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/static/commands.json" --output "$RUNNER_TEMP/ci/static"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-static
          path: ${{ runner.temp }}/ci/static
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - if: steps.produce.outcome != 'success'
        run: exit 1

  suites:
    name: Workspace suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/suites"
          node scripts/ci/checks.mjs --lane suites --output "$RUNNER_TEMP/ci/suites"
          node scripts/ci/ci-dispatcher.mjs --release-id "$RELEASE_ID" --lane-id suites --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/suites/commands.json" --output "$RUNNER_TEMP/ci/suites"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-suites
          path: ${{ runner.temp }}/ci/suites
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - if: steps.produce.outcome != 'success'
        run: exit 1

  mobile-export:
    name: Mobile production export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/mobile-export"
          node scripts/ci/checks.mjs --lane mobile-export --output "$RUNNER_TEMP/ci/mobile-export"
          node scripts/ci/ci-dispatcher.mjs --release-id "$RELEASE_ID" --lane-id mobile-export --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/mobile-export/commands.json" --output "$RUNNER_TEMP/ci/mobile-export"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-mobile-export
          path: ${{ runner.temp }}/ci/mobile-export
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  mobile-smoke:
    name: Mobile HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/mobile-smoke"
          node scripts/ci/checks.mjs --lane mobile-smoke --output "$RUNNER_TEMP/ci/mobile-smoke"
          node scripts/ci/ci-dispatcher.mjs --release-id "$RELEASE_ID" --lane-id mobile-smoke --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/mobile-smoke/commands.json" --output "$RUNNER_TEMP/ci/mobile-smoke"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-mobile-smoke
          path: ${{ runner.temp }}/ci/mobile-smoke
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  db:
    name: Disposable PostgreSQL suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: imeal_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d imeal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/db"
          node scripts/ci/checks.mjs --lane db --output "$RUNNER_TEMP/ci/db"
          node scripts/ci/ci-dispatcher.mjs --release-id "$RELEASE_ID" --lane-id db --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/db/commands.json" --output "$RUNNER_TEMP/ci/db" --preserve-database-url
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-db
          path: ${{ runner.temp }}/ci/db
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - if: steps.produce.outcome != 'success'
        run: exit 1

  tooling:
    name: Staging tooling and Compose tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/tooling"
          node scripts/ci/checks.mjs --lane tooling --output "$RUNNER_TEMP/ci/tooling"
          node scripts/ci/ci-dispatcher.mjs --allow-docker --release-id "$RELEASE_ID" --lane-id tooling --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/tooling/commands.json" --output "$RUNNER_TEMP/ci/tooling"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-tooling
          path: ${{ runner.temp }}/ci/tooling
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - if: steps.produce.outcome != 'success'
        run: exit 1

  security:
    name: Security matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [audit, secrets]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/security-${{ matrix.kind }}"
          node scripts/ci/checks.mjs --lane "security-${{ matrix.kind }}" --output "$RUNNER_TEMP/ci/security-${{ matrix.kind }}"
          node scripts/ci/ci-dispatcher.mjs --allow-docker --release-id "$RELEASE_ID" --lane-id "security-${{ matrix.kind }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/security-${{ matrix.kind }}/commands.json" --output "$RUNNER_TEMP/ci/security-${{ matrix.kind }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-security-${{ matrix.kind }}
          path: ${{ runner.temp }}/ci/security-${{ matrix.kind }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  images:
    name: Image build scan SBOM matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, admin-web]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          yarn install --immutable
      - id: produce
        run: |
          mkdir -p "$RUNNER_TEMP/ci/images-${{ matrix.service }}"
          node scripts/ci/checks.mjs --lane "images-${{ matrix.service }}" --output "$RUNNER_TEMP/ci/images-${{ matrix.service }}"
          set +e
          node scripts/ci/ci-dispatcher.mjs --allow-docker --release-id "$RELEASE_ID" --lane-id "images-${{ matrix.service }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --commands-json "$RUNNER_TEMP/ci/images-${{ matrix.service }}/commands.json" --output "$RUNNER_TEMP/ci/images-${{ matrix.service }}"
          dispatch_status=$?
          set -e
          image_id=''
          if image_id="$(docker image inspect --format '{{.Id}}' "imeal/${{ matrix.service }}:${GITHUB_SHA}" 2>/dev/null)"; then
            sbom_path="$RUNNER_TEMP/ci/images-${{ matrix.service }}/build-image-sbom-${{ matrix.service }}.spdx.json"
            if [ -f "$sbom_path" ]; then
              sbom_hash="$(sha256sum "$sbom_path" | cut -d' ' -f1)"
              printf '%s\n' "$image_id" > "$RUNNER_TEMP/ci/images-${{ matrix.service }}/image-inspection.txt"
              node scripts/ci/record-built-image.mjs "$RUNNER_TEMP/ci/images-${{ matrix.service }}/producer-result.json" "$image_id" "$sbom_hash" "${{ matrix.service }}" "$GITHUB_SHA"
            fi
          fi
          test -f "$RUNNER_TEMP/ci/images-${{ matrix.service }}/producer-result.json"
          exit "$dispatch_status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-images-${{ matrix.service }}
          path: ${{ runner.temp }}/ci/images-${{ matrix.service }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  checks:
    name: Secretless qualification (disposable PostgreSQL)
    needs: [static, suites, mobile-export, mobile-smoke, db, tooling, security, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - if: always()
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: always()
        id: release
        run: |
          printf 'release_id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"
      - if: always()
        name: Set up Node 24 for aggregation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-static
          path: ${{ runner.temp }}/ci/evidence/static
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-suites
          path: ${{ runner.temp }}/ci/evidence/suites
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-mobile-export
          path: ${{ runner.temp }}/ci/evidence/mobile-export
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-mobile-smoke
          path: ${{ runner.temp }}/ci/evidence/mobile-smoke
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-db
          path: ${{ runner.temp }}/ci/evidence/db
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-tooling
          path: ${{ runner.temp }}/ci/evidence/tooling
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-security-audit
          path: ${{ runner.temp }}/ci/evidence/security-audit
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-security-secrets
          path: ${{ runner.temp }}/ci/evidence/security-secrets
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-images-api
          path: ${{ runner.temp }}/ci/evidence/images-api
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-images-worker
          path: ${{ runner.temp }}/ci/evidence/images-worker
      - if: always() && !cancelled()
        uses: actions/download-artifact@v4
        with:
          name: staging-qualification-${{ env.RELEASE_ID }}-images-admin-web
          path: ${{ runner.temp }}/ci/evidence/images-admin-web
      - if: cancelled()
        id: global_cancellation
        run: |
          printf 'cancelled=true\n' >> "$GITHUB_OUTPUT"
      - if: always()
        name: Aggregate qualification evidence
        id: aggregate
        run: |
          mkdir -p "$RUNNER_TEMP/ci/aggregate"
          cat > "$RUNNER_TEMP/ci/needs.json" <<'JSON'
          ${{ toJSON(needs) }}
          JSON
          node scripts/ci/aggregate-qualification.mjs --evidence-root "$RUNNER_TEMP/ci/evidence" --output-directory "$RUNNER_TEMP/ci/aggregate" --needs-json "$RUNNER_TEMP/ci/needs.json" --release-id "$RELEASE_ID" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$GITHUB_SHA" --workflow-sha "$GITHUB_WORKFLOW_SHA" --cancelled "${{ steps.global_cancellation.outputs.cancelled || 'false' }}"
      - if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci/aggregate"
          test -f "$RUNNER_TEMP/ci/aggregate/check-results.json" || printf '%s\n' '{"result":"FAIL","reason":"aggregate evidence missing"}' > "$RUNNER_TEMP/ci/aggregate/check-results.json"
      - if: success() && !cancelled() && steps.aggregate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: staging-readiness-inputs-${{ steps.release.outputs.release_id }}
          path: ${{ runner.temp }}/ci/aggregate
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - if: always() && (cancelled() || steps.aggregate.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: staging-qualification-diagnostics-${{ env.RELEASE_ID }}
          path: ${{ runner.temp }}/ci/aggregate
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - if: always() && (cancelled() || steps.aggregate.outcome != 'success')
        run: exit 1
  staging-deploy:
    name: Protected staging qualification (ephemeral Compose)
    needs: checks
    if: >-
      needs.checks.result == 'success' && (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/deploy/staging'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/deploy/staging' &&
          inputs.deploy_staging == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
    permissions:
      contents: read
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Do not enable setup-node Yarn caching: it queries Yarn before Corepack activation.

      - name: Enable Corepack and select Yarn 4.18
        run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          test "$(corepack yarn --version)" = "${YARN_VERSION}"

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Download verified source evidence
        uses: actions/download-artifact@v4
        with:
          name: staging-readiness-inputs-${{ needs.checks.outputs.release_id }}
          path: ${{ runner.temp }}/staging-artifacts

      - name: Validate source qualification provenance
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/staging-artifacts/check-results.json" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [path] = process.argv.slice(2);
          const checks = JSON.parse(await readFile(path, 'utf8'));
          const provenance = checks.provenance;
          if (checks.result !== 'PASS') throw new Error('source qualification did not PASS');
          if (
            provenance?.runId !== process.env.EXPECTED_RUN_ID ||
            provenance?.sourceSha !== process.env.EXPECTED_SOURCE_SHA ||
            provenance?.workflowSha !== process.env.EXPECTED_WORKFLOW_SHA ||
            !Number.isInteger(provenance?.currentAttempt) ||
            provenance.currentAttempt > Number(process.env.EXPECTED_ATTEMPT)
          ) throw new Error('source qualification provenance mismatch');
          for (const [laneId, reference] of Object.entries(checks.producerReferences ?? {})) {
            if (reference.result !== 'PASS' || reference.runAttempt > Number(process.env.EXPECTED_ATTEMPT)) {
              throw new Error(`producer ${laneId} is not a verified PASS for this attempt`);
            }
          }
          NODE

      - name: Require protected staging deployment inputs
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          STAGING_SMOKE_SESSION_TOKEN: ${{ secrets.STAGING_SMOKE_SESSION_TOKEN }}
          STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
          STAGING_ADMIN_ORIGIN: ${{ vars.STAGING_ADMIN_ORIGIN }}
          STAGING_IMAGE_DIGESTS_JSON: ${{ vars.STAGING_IMAGE_DIGESTS_JSON }}
          STAGING_ROLLBACK_ARTIFACT: ${{ vars.STAGING_ROLLBACK_ARTIFACT }}
        run: |
          test -n "$STAGING_ENV_FILE" || { echo 'STAGING_ENV_FILE is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_SMOKE_SESSION_TOKEN" || { echo 'STAGING_SMOKE_SESSION_TOKEN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_API_ORIGIN" || { echo 'STAGING_API_ORIGIN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_WORKER_ORIGIN" || { echo 'STAGING_WORKER_ORIGIN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_ADMIN_ORIGIN" || { echo 'STAGING_ADMIN_ORIGIN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_IMAGE_DIGESTS_JSON" || { echo 'STAGING_IMAGE_DIGESTS_JSON is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_ROLLBACK_ARTIFACT" || { echo 'STAGING_ROLLBACK_ARTIFACT is required in the protected staging environment'; exit 1; }
          umask 077
          printf '%s\n' "$STAGING_ENV_FILE" > "$RUNNER_TEMP/staging.env"
          printf '%s\n' "$STAGING_IMAGE_DIGESTS_JSON" > "$RUNNER_TEMP/images.json"
          printf '%s\n' "$STAGING_ROLLBACK_ARTIFACT" > "$RUNNER_TEMP/rollback-artifact.txt"
          printf '%s\n' "$STAGING_API_ORIGIN" > "$RUNNER_TEMP/api-origin.txt"
          printf '%s\n' "$STAGING_WORKER_ORIGIN" > "$RUNNER_TEMP/worker-origin.txt"
          printf '%s\n' "$STAGING_ADMIN_ORIGIN" > "$RUNNER_TEMP/admin-origin.txt"
          node --input-type=module - \
            "$RUNNER_TEMP/staging.env" \
            "$RUNNER_TEMP/images.json" \
            "$RUNNER_TEMP/release-version.txt" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const [envPath, imagePath, releasePath] = process.argv.slice(2);
          const digestPattern = /^[^\s@]+@sha256:[a-f0-9]{64}$/i;
          const imageKeys = ['API_IMAGE', 'WORKER_IMAGE', 'ADMIN_WEB_IMAGE'];
          const imageJson = JSON.parse(await readFile(imagePath, 'utf8'));
          const expectedImages = {
            API_IMAGE: imageJson.api,
            WORKER_IMAGE: imageJson.worker,
            ADMIN_WEB_IMAGE: imageJson.adminWeb,
          };
          if (
            Object.keys(imageJson).sort().join(',') !==
            ['adminWeb', 'api', 'worker'].join(',')
          ) {
            throw new Error('protected image digest input has unsupported fields');
          }
          for (const [key, value] of Object.entries(expectedImages)) {
            if (typeof value !== 'string' || !digestPattern.test(value)) {
              throw new Error('protected image digest input is not immutable');
            }
          }

          const lines = (await readFile(envPath, 'utf8')).split(/\r?\n/);
          const seen = new Set();
          const output = [];
          let releaseVersion;
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) {
              output.push(line);
              continue;
            }
            const match = /^([A-Z][A-Z0-9_]*)=(.*)$/.exec(line);
            if (!match) throw new Error('protected staging env has an invalid assignment');
            const [, key, rawValue] = match;
            if (seen.has(key)) throw new Error('protected staging env has duplicate keys');
            seen.add(key);
            let value = rawValue.trim();
            if (
              value.length >= 2 &&
              ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'")))
            ) {
              value = value.slice(1, -1);
            }
            if (key.endsWith('_IMAGE')) {
              if (!digestPattern.test(value)) {
                throw new Error('every protected image env value must be digest-pinned');
              }
              if (Object.hasOwn(expectedImages, key) && value !== expectedImages[key]) {
                throw new Error('protected image env does not match image digest input');
              }
            }
            if (key === 'RELEASE_VERSION') releaseVersion = value;
            output.push(line);
          }
          for (const key of imageKeys) {
            if (!seen.has(key)) output.push(`${key}=${expectedImages[key]}`);
          }
          if (!releaseVersion) throw new Error('RELEASE_VERSION is required');
          await writeFile(envPath, `${output.join('\n').replace(/\n+$/, '')}\n`);
          await writeFile(releasePath, releaseVersion);
          NODE

      - name: Verify immutable digests including migration gate
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          node scripts/staging/protected-qualification.mjs verify-images \
            --images-json "$RUNNER_TEMP/images.json" \
            --env-file "$RUNNER_TEMP/staging.env" \
            --output "$RUNNER_TEMP/staging-artifacts/image-contract.json"
          node scripts/staging/protected-qualification.mjs print-migration-gate \
            --contract "$RUNNER_TEMP/staging-artifacts/image-contract.json" \
            > "$RUNNER_TEMP/migration-gate-image.txt"

      - name: Scan exact protected deployment image digests
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          cleanup_scan_archives() {
            rm -f "$RUNNER_TEMP"/deployed-image-*.tar
          }
          trap cleanup_scan_archives EXIT
          for service in api worker admin-web; do
            node scripts/staging/image-scan.mjs \
              --images-json "$RUNNER_TEMP/images.json" \
              --service "$service" \
              --trivy-image "${TRIVY_IMAGE}" \
              --cache-directory "$RUNNER_TEMP/trivy-cache" \
              --archive "$RUNNER_TEMP/deployed-image-${service}.tar" \
              --report "$RUNNER_TEMP/staging-artifacts/deployed-image-trivy-${service}.log" \
              || {
                echo 'protected deployment image security scan failed' >&2
                exit 1
              }
          done
          node scripts/staging/image-scan.mjs \
            --image "$(cat "$RUNNER_TEMP/migration-gate-image.txt")" \
            --trivy-image "${TRIVY_IMAGE}" \
            --cache-directory "$RUNNER_TEMP/trivy-cache" \
            --archive "$RUNNER_TEMP/deployed-image-migration-gate.tar" \
            --report "$RUNNER_TEMP/staging-artifacts/deployed-image-trivy-migration-gate.log" \
            || {
              echo 'migration-gate image security scan failed' >&2
              exit 1
            }

      - name: Render protected staging Compose configuration
        run: >-
          docker compose --env-file "$RUNNER_TEMP/staging.env"
          -f docker-compose.yml -f docker-compose.staging.yml config --quiet

      - name: Deploy the approved immutable staging release
        run: >-
          docker compose --env-file "$RUNNER_TEMP/staging.env"
          -f docker-compose.yml -f docker-compose.staging.yml up
          --detach --wait --remove-orphans

      - name: Wait for migration gate and runtime health
        run: |
          node scripts/staging/protected-qualification.mjs wait-runtime \
            --env-file "$RUNNER_TEMP/staging.env" \
            --compose-file docker-compose.yml \
            --compose-file docker-compose.staging.yml \
            --contract "$RUNNER_TEMP/staging-artifacts/image-contract.json" \
            --gate-service migrate \
            --expected-release-file "$RUNNER_TEMP/release-version.txt" \
            --output-directory "$RUNNER_TEMP/staging-artifacts"

      - name: Generate SBOMs for deployed image digests
        run: |
          for service in api worker admin-web; do
            image="$(
              node --input-type=module - \
                "$RUNNER_TEMP/images.json" "$service" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [path, service] = process.argv.slice(2);
          const images = JSON.parse(await readFile(path, 'utf8'));
          const key = service === 'admin-web' ? 'adminWeb' : service;
          process.stdout.write(images[key]);
          NODE
            )"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/staging-artifacts:/out" \
              anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b \
              "docker:${image}" \
              --output "spdx-json=/out/deployed-image-sbom-${service}.spdx.json"
          done
          migration_image="$(cat "$RUNNER_TEMP/migration-gate-image.txt")"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/staging-artifacts:/out" \
            anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b \
            "docker:${migration_image}" \
            --output "spdx-json=/out/deployed-image-sbom-migration-gate.spdx.json"
          cat > "$RUNNER_TEMP/staging-artifacts/deployed-image-sbom-index.json" <<'JSON'
          {
            "api": "artifacts/deployed-image-sbom-api.spdx.json",
            "worker": "artifacts/deployed-image-sbom-worker.spdx.json",
            "adminWeb": "artifacts/deployed-image-sbom-admin-web.spdx.json",
            "migrationGate": "artifacts/deployed-image-sbom-migration-gate.spdx.json"
          }
          JSON

      - name: Run protected production-hardening runtime integration
        env:
          STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/staging-artifacts/runtime-integration.json" \
            "$(cat "$RUNNER_TEMP/release-version.txt")" \
            "$RUNNER_TEMP/staging.env" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { assertNoSecrets } from './scripts/staging/staging-lib.mjs';
          import { runRuntimeIntegration } from './scripts/staging/runtime-integration.mjs';

          const [outputPath, expectedRelease, envPath] = process.argv.slice(2);
          const env = Object.fromEntries(
            (await readFile(envPath, 'utf8'))
              .split(/\r?\n/)
              .map((line) => line.match(/^(POSTGRES_DB|MIGRATION_TARGET_SCHEMA)=(.*)$/))
              .filter(Boolean)
              .map(([, key, value]) => [key, value.replace(/^(['"])(.*)\1$/, '$2')]),
          );
          const target = {
            database: env.POSTGRES_DB,
            schema: env.MIGRATION_TARGET_SCHEMA,
          };
          if (
            !/^[A-Za-z_][A-Za-z0-9_]*$/.test(target.database ?? '') ||
            !/^[A-Za-z_][A-Za-z0-9_]*$/.test(target.schema ?? '')
          ) {
            throw new Error('protected runtime target binding is invalid');
          }
          let report;
          let passed = true;
          try {
            report = {
              result: 'PASS',
              releaseId: expectedRelease,
              target,
              evidence: await runRuntimeIntegration({
                apiOrigin: process.env.STAGING_API_ORIGIN,
                workerOrigin: process.env.STAGING_WORKER_ORIGIN,
                expectedRelease,
              }),
            };
          } catch {
            passed = false;
            report = {
              result: 'FAIL',
              reason: 'production hardening runtime integration failed',
            };
          }
          assertNoSecrets(report);
          await writeFile(outputPath, `${JSON.stringify(report, null, 2)}\n`, {
            encoding: 'utf8',
            mode: 0o440,
          });
          if (!passed) process.exitCode = 1;
          NODE

      - name: Run protected staging smoke
        env:
          STAGING_SMOKE_SESSION_TOKEN: ${{ secrets.STAGING_SMOKE_SESSION_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          yarn staging:smoke \
            --api-origin "$(cat "$RUNNER_TEMP/api-origin.txt")" \
            --admin-origin "$(cat "$RUNNER_TEMP/admin-origin.txt")" \
            --session-token-env STAGING_SMOKE_SESSION_TOKEN \
            --output "$RUNNER_TEMP/staging-artifacts/staging-smoke.json"

      - name: Record observed runtime and smoke evidence
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/staging-artifacts/check-results.json" \
            "$RUNNER_TEMP/staging-artifacts/runtime-integration.json" \
            "$RUNNER_TEMP/staging-artifacts/staging-smoke.json" \
            "$RUNNER_TEMP/staging.env" \
            "$(cat "$RUNNER_TEMP/release-version.txt")" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const [checksPath, runtimePath, smokePath, envPath, releaseId] =
            process.argv.slice(2);
          const env = Object.fromEntries(
            (await readFile(envPath, 'utf8'))
              .split(/\r?\n/)
              .map((line) => line.match(/^(POSTGRES_DB|MIGRATION_TARGET_SCHEMA)=(.*)$/))
              .filter(Boolean)
              .map(([, key, value]) => [key, value.replace(/^(['"])(.*)\1$/, '$2')]),
          );
          const target = {
            database: env.POSTGRES_DB,
            schema: env.MIGRATION_TARGET_SCHEMA,
          };
          const runtime = JSON.parse(await readFile(runtimePath, 'utf8'));
          if (runtime.result !== 'PASS') throw new Error('runtime integration did not PASS');
          const smoke = JSON.parse(await readFile(smokePath, 'utf8'));
          if (smoke.result !== 'PASS') throw new Error('staging smoke did not PASS');
          smoke.releaseId = releaseId;
          smoke.target = target;
          await writeFile(smokePath, `${JSON.stringify(smoke, null, 2)}\n`, 'utf8');
          const checks = JSON.parse(await readFile(checksPath, 'utf8'));
          checks.runtimeIntegration = 'PASS';
          checks.stagingSmoke = 'PASS';
          checks.security = 'PASS';
          checks.sbom = 'artifacts/deployed-image-sbom-index.json';
          checks.stagingSmokeReference = 'artifacts/staging-smoke.json';
          await writeFile(checksPath, `${JSON.stringify(checks, null, 2)}\n`, 'utf8');
          NODE

      - name: Generate the immutable release manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          : "${RELEASE_COMMIT:?exact reviewed release commit is required}"
          case "$RELEASE_COMMIT" in
            ''|*[!0-9a-fA-F]*)
              echo 'release commit must be hexadecimal' >&2
              exit 1
              ;;
          esac
          if [ "${#RELEASE_COMMIT}" -lt 7 ] || [ "${#RELEASE_COMMIT}" -gt 64 ]; then
            echo 'release commit length is invalid' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" || {
            echo 'checked-out commit does not match the reviewed release commit' >&2
            exit 1
          }
          yarn staging:manifest \
            --release-id "${{ needs.checks.outputs.release_id }}" \
            --commit "$RELEASE_COMMIT" \
            --images-json "$RUNNER_TEMP/images.json" \
            --checks-json "$RUNNER_TEMP/staging-artifacts/check-results.json" \
            --rollback-artifact "$(cat "$RUNNER_TEMP/rollback-artifact.txt")" \
            --output "$RUNNER_TEMP/staging-artifacts/release-manifest.json"

      - name: Capture rollback reference
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/staging/protected-qualification.mjs rollback-reference \
            --release-id "${{ needs.checks.outputs.release_id }}" \
            --commit "$RELEASE_COMMIT" \
            --images-json "$RUNNER_TEMP/images.json" \
            --migration-gate-image-file "$RUNNER_TEMP/migration-gate-image.txt" \
            --rollback-artifact-file "$RUNNER_TEMP/rollback-artifact.txt" \
            --output "$RUNNER_TEMP/staging-artifacts/rollback-reference.json"

      - name: Include protected manifest inputs in uploaded evidence
        if: always()
        run: |
          test -f "$RUNNER_TEMP/images.json" && test ! -L "$RUNNER_TEMP/images.json"
          test -f "$RUNNER_TEMP/release-version.txt" && test ! -L "$RUNNER_TEMP/release-version.txt"
          install -m 0440 \
            "$RUNNER_TEMP/images.json" \
            "$RUNNER_TEMP/staging-artifacts/images.json"
          install -m 0440 \
            "$RUNNER_TEMP/release-version.txt" \
            "$RUNNER_TEMP/staging-artifacts/release-version.txt"

      - name: Reject secret-bearing staging artifacts
        id: redact
        if: always()
        run: |
          node scripts/staging/protected-qualification.mjs assert-artifacts \
            --directory "$RUNNER_TEMP/staging-artifacts"

      - name: Upload protected staging evidence
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ needs.checks.outputs.release_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Tear down disposable staging services
        if: always()
        run: >-
          docker compose --env-file "$RUNNER_TEMP/staging.env"
          -f docker-compose.yml -f docker-compose.staging.yml down
          --volumes --remove-orphans
