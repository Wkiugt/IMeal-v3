name: staging-readiness

on:
  pull_request:
  push:
    branches:
      - deploy/develop
      - deploy/staging
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Explicitly qualify the protected ephemeral staging target
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  YARN_VERSION: '4.18.0'
  CI: 'true'
  TRIVY_IMAGE: aquasec/trivy@sha256:fa9a2d2a839e69bfc0e774e885c526b5db20dc1feba5bcd1bfb59e51e7855ae0

jobs:
  checks:
    name: Secretless qualification (disposable PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imeal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imeal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Do not enable setup-node Yarn caching: it queries Yarn before Corepack activation.
      - name: Enable Corepack and select Yarn 4.18
        run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          test "$(corepack yarn --version)" = "${YARN_VERSION}"

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
        run: yarn workspace @imeal/core exec prisma validate --schema prisma/schema.prisma

      - name: Record release identity
        id: release
        run: |
          release_id="imeal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Typecheck contracts, domain, API, worker, mobile and Admin Web
        run: yarn typecheck
      - name: Validate Expo SDK57 dependency alignment
        working-directory: apps/mobile
        run: |
          npx expo install --check
          npx --yes expo-doctor@1.20.4

      - name: Smoke Metro Android, iOS and web bundles
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          yarn turbo run build --filter=@imeal/core --filter=@imeal/contracts
          metro_log="$RUNNER_TEMP/imeal-metro.log"
          yarn exec expo start --clear --localhost >"$metro_log" 2>&1 &
          metro_pid=$!
          cleanup() {
            exit_code=$?
            printf 'Stopping Metro (pid=%s), exit=%s\n' "$metro_pid" "$exit_code"
            kill "$metro_pid" 2>/dev/null || true
            wait "$metro_pid" 2>/dev/null || true
            if [ "$exit_code" -ne 0 ]; then
              cat "$metro_log"
            fi
            return "$exit_code"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/status >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat "$metro_log"
              exit 1
            fi
            sleep 2
          done
          for platform in android ios web; do
            output="$RUNNER_TEMP/imeal-${platform}.bundle"
            curl --fail --silent --show-error \
              "http://127.0.0.1:8081/node_modules/expo/AppEntry.bundle?platform=${platform}&dev=false&minify=false" \
              --output "$output"
          done
          printf 'Metro startup log:\n'
          cat "$metro_log"

      - name: Lint the workspace
        run: yarn lint

      - name: Run unit and contract tests
        run: yarn test:unit

      - name: Verify build dependency ordering
        run: yarn test:build-order
      - name: Apply migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
        run: yarn workspace @imeal/core exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run disposable domain database checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
        run: yarn workspace @imeal/core test

      - name: Run disposable API database checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
        run: yarn workspace @imeal/api test:e2e

      - name: Run disposable worker database checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imeal_ci?schema=public
        run: yarn workspace @imeal/worker test:e2e

      - name: Run staging tooling and manifest contract tests
        run: yarn test:staging-tools
      - name: Validate staging Compose boundary
        run: node --test scripts/staging/compose-config.test.mjs

      - name: Build API, worker and Admin Web images
        run: |
          docker build --file apps/api/Dockerfile --tag imeal/api:${GITHUB_SHA} .
          docker build --file apps/worker/Dockerfile --tag imeal/worker:${GITHUB_SHA} .
          docker build --file apps/admin-web/Dockerfile --tag imeal/admin-web:${GITHUB_SHA} .

      - name: Audit dependencies
        id: audit
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          audit_log="$RUNNER_TEMP/staging-artifacts/dependency-audit.log"
          set +e
          yarn npm audit --all --recursive >"$audit_log" 2>&1
          audit_status=$?
          cat "$audit_log"
          exit "$audit_status"

      - name: Upload dependency audit diagnostics
        if: ${{ always() && steps.audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-artifacts/dependency-audit.log
          if-no-files-found: error
          retention-days: 14
      - name: Scan source for secrets with redacted output
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --redact --no-banner --exit-code=1

      - name: Scan built images for high and critical vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for image in \
            "imeal/api:${GITHUB_SHA}" \
            "imeal/worker:${GITHUB_SHA}" \
            "imeal/admin-web:${GITHUB_SHA}"; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" \
              image --timeout 15m --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done

      - name: Generate SBOMs for built images
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          for service in api worker admin-web; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/staging-artifacts:/out" \
              anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b \
              "docker:imeal/${service}:${GITHUB_SHA}" \
              --output "spdx-json=/out/build-image-sbom-${service}.spdx.json"
          done
          cat > "$RUNNER_TEMP/staging-artifacts/build-image-sbom-index.json" <<'JSON'
          {
            "api": "artifacts/build-image-sbom-api.spdx.json",
            "worker": "artifacts/build-image-sbom-worker.spdx.json",
            "adminWeb": "artifacts/build-image-sbom-admin-web.spdx.json"
          }
          JSON

      - name: Write verified check results
        run: |
          cat > "$RUNNER_TEMP/staging-artifacts/check-results.json" <<'JSON'
          {
            "typecheck": "PASS",
            "lint": "PASS",
            "unit": "PASS",
            "prisma": "PASS",
            "db": "PASS",
            "compose": "PASS",
            "stagingTools": "PASS",
            "sbom": "artifacts/build-image-sbom-index.json"
          }
          JSON

      - name: Upload checked source evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-readiness-inputs-${{ steps.release.outputs.release_id }}
          path: ${{ runner.temp }}/staging-artifacts
          if-no-files-found: error
          retention-days: 14

  staging-deploy:
    name: Protected staging qualification (ephemeral Compose)
    needs: checks
    if: >-
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/deploy/staging'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/deploy/staging' &&
        inputs.deploy_staging == true
      )
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Do not enable setup-node Yarn caching: it queries Yarn before Corepack activation.

      - name: Enable Corepack and select Yarn 4.18
        run: |
          corepack enable
          corepack install --global "yarn@${YARN_VERSION}"
          test "$(corepack yarn --version)" = "${YARN_VERSION}"

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Download verified source evidence
        uses: actions/download-artifact@v4
        with:
          name: staging-readiness-inputs-${{ needs.checks.outputs.release_id }}
          path: ${{ runner.temp }}/staging-artifacts

      - name: Require protected staging deployment inputs
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          STAGING_SMOKE_SESSION_TOKEN: ${{ secrets.STAGING_SMOKE_SESSION_TOKEN }}
          STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
          STAGING_ADMIN_ORIGIN: ${{ vars.STAGING_ADMIN_ORIGIN }}
          STAGING_IMAGE_DIGESTS_JSON: ${{ vars.STAGING_IMAGE_DIGESTS_JSON }}
          STAGING_ROLLBACK_ARTIFACT: ${{ vars.STAGING_ROLLBACK_ARTIFACT }}
        run: |
          test -n "$STAGING_ENV_FILE" || { echo 'STAGING_ENV_FILE is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_SMOKE_SESSION_TOKEN" || { echo 'STAGING_SMOKE_SESSION_TOKEN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_API_ORIGIN" || { echo 'STAGING_API_ORIGIN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_WORKER_ORIGIN" || { echo 'STAGING_WORKER_ORIGIN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_ADMIN_ORIGIN" || { echo 'STAGING_ADMIN_ORIGIN is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_IMAGE_DIGESTS_JSON" || { echo 'STAGING_IMAGE_DIGESTS_JSON is required in the protected staging environment'; exit 1; }
          test -n "$STAGING_ROLLBACK_ARTIFACT" || { echo 'STAGING_ROLLBACK_ARTIFACT is required in the protected staging environment'; exit 1; }
          umask 077
          printf '%s\n' "$STAGING_ENV_FILE" > "$RUNNER_TEMP/staging.env"
          printf '%s\n' "$STAGING_IMAGE_DIGESTS_JSON" > "$RUNNER_TEMP/images.json"
          printf '%s\n' "$STAGING_ROLLBACK_ARTIFACT" > "$RUNNER_TEMP/rollback-artifact.txt"
          printf '%s\n' "$STAGING_API_ORIGIN" > "$RUNNER_TEMP/api-origin.txt"
          printf '%s\n' "$STAGING_WORKER_ORIGIN" > "$RUNNER_TEMP/worker-origin.txt"
          printf '%s\n' "$STAGING_ADMIN_ORIGIN" > "$RUNNER_TEMP/admin-origin.txt"
          node --input-type=module - \
            "$RUNNER_TEMP/staging.env" \
            "$RUNNER_TEMP/images.json" \
            "$RUNNER_TEMP/release-version.txt" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const [envPath, imagePath, releasePath] = process.argv.slice(2);
          const digestPattern = /^[^\s@]+@sha256:[a-f0-9]{64}$/i;
          const imageKeys = ['API_IMAGE', 'WORKER_IMAGE', 'ADMIN_WEB_IMAGE'];
          const imageJson = JSON.parse(await readFile(imagePath, 'utf8'));
          const expectedImages = {
            API_IMAGE: imageJson.api,
            WORKER_IMAGE: imageJson.worker,
            ADMIN_WEB_IMAGE: imageJson.adminWeb,
          };
          if (
            Object.keys(imageJson).sort().join(',') !==
            ['adminWeb', 'api', 'worker'].join(',')
          ) {
            throw new Error('protected image digest input has unsupported fields');
          }
          for (const [key, value] of Object.entries(expectedImages)) {
            if (typeof value !== 'string' || !digestPattern.test(value)) {
              throw new Error('protected image digest input is not immutable');
            }
          }

          const lines = (await readFile(envPath, 'utf8')).split(/\r?\n/);
          const seen = new Set();
          const output = [];
          let releaseVersion;
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) {
              output.push(line);
              continue;
            }
            const match = /^([A-Z][A-Z0-9_]*)=(.*)$/.exec(line);
            if (!match) throw new Error('protected staging env has an invalid assignment');
            const [, key, rawValue] = match;
            if (seen.has(key)) throw new Error('protected staging env has duplicate keys');
            seen.add(key);
            let value = rawValue.trim();
            if (
              value.length >= 2 &&
              ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'")))
            ) {
              value = value.slice(1, -1);
            }
            if (key.endsWith('_IMAGE')) {
              if (!digestPattern.test(value)) {
                throw new Error('every protected image env value must be digest-pinned');
              }
              if (Object.hasOwn(expectedImages, key) && value !== expectedImages[key]) {
                throw new Error('protected image env does not match image digest input');
              }
            }
            if (key === 'RELEASE_VERSION') releaseVersion = value;
            output.push(line);
          }
          for (const key of imageKeys) {
            if (!seen.has(key)) output.push(`${key}=${expectedImages[key]}`);
          }
          if (!releaseVersion) throw new Error('RELEASE_VERSION is required');
          await writeFile(envPath, `${output.join('\n').replace(/\n+$/, '')}\n`);
          await writeFile(releasePath, releaseVersion);
          NODE

      - name: Scan exact protected deployment image digests
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          cleanup_scan_archives() {
            rm -f "$RUNNER_TEMP"/deployed-image-*.tar
          }
          trap cleanup_scan_archives EXIT
          for service in api worker admin-web; do
            node scripts/staging/image-scan.mjs \
              --images-json "$RUNNER_TEMP/images.json" \
              --service "$service" \
              --trivy-image "${TRIVY_IMAGE}" \
              --cache-directory "$RUNNER_TEMP/trivy-cache" \
              --archive "$RUNNER_TEMP/deployed-image-${service}.tar" \
              --report "$RUNNER_TEMP/staging-artifacts/deployed-image-trivy-${service}.log" \
              || {
                echo 'protected deployment image security scan failed' >&2
                exit 1
              }
          done

      - name: Render protected staging Compose configuration
        run: >-
          docker compose --env-file "$RUNNER_TEMP/staging.env"
          -f docker-compose.yml -f docker-compose.staging.yml config --quiet

      - name: Deploy the approved immutable staging release
        run: >-
          docker compose --env-file "$RUNNER_TEMP/staging.env"
          -f docker-compose.yml -f docker-compose.staging.yml up
          --detach --wait --remove-orphans

      - name: Generate SBOMs for deployed image digests
        run: |
          for service in api worker admin-web; do
            image="$(
              node --input-type=module - \
                "$RUNNER_TEMP/images.json" "$service" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [path, service] = process.argv.slice(2);
          const images = JSON.parse(await readFile(path, 'utf8'));
          const key = service === 'admin-web' ? 'adminWeb' : service;
          process.stdout.write(images[key]);
          NODE
            )"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/staging-artifacts:/out" \
              anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b \
              "docker:${image}" \
              --output "spdx-json=/out/deployed-image-sbom-${service}.spdx.json"
          done
          cat > "$RUNNER_TEMP/staging-artifacts/deployed-image-sbom-index.json" <<'JSON'
          {
            "api": "artifacts/deployed-image-sbom-api.spdx.json",
            "worker": "artifacts/deployed-image-sbom-worker.spdx.json",
            "adminWeb": "artifacts/deployed-image-sbom-admin-web.spdx.json"
          }
          JSON

      - name: Run protected production-hardening runtime integration
        env:
          STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          STAGING_WORKER_ORIGIN: ${{ vars.STAGING_WORKER_ORIGIN }}
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/staging-artifacts/runtime-integration.json" \
            "$(cat "$RUNNER_TEMP/release-version.txt")" \
            "$RUNNER_TEMP/staging.env" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { assertNoSecrets } from './scripts/staging/staging-lib.mjs';
          import { runRuntimeIntegration } from './scripts/staging/runtime-integration.mjs';

          const [outputPath, expectedRelease, envPath] = process.argv.slice(2);
          const env = Object.fromEntries(
            (await readFile(envPath, 'utf8'))
              .split(/\r?\n/)
              .map((line) => line.match(/^(POSTGRES_DB|MIGRATION_TARGET_SCHEMA)=(.*)$/))
              .filter(Boolean)
              .map(([, key, value]) => [key, value.replace(/^(['"])(.*)\1$/, '$2')]),
          );
          const target = {
            database: env.POSTGRES_DB,
            schema: env.MIGRATION_TARGET_SCHEMA,
          };
          if (
            !/^[A-Za-z_][A-Za-z0-9_]*$/.test(target.database ?? '') ||
            !/^[A-Za-z_][A-Za-z0-9_]*$/.test(target.schema ?? '')
          ) {
            throw new Error('protected runtime target binding is invalid');
          }
          let report;
          let passed = true;
          try {
            report = {
              result: 'PASS',
              releaseId: expectedRelease,
              target,
              evidence: await runRuntimeIntegration({
                apiOrigin: process.env.STAGING_API_ORIGIN,
                workerOrigin: process.env.STAGING_WORKER_ORIGIN,
                expectedRelease,
              }),
            };
          } catch {
            passed = false;
            report = {
              result: 'FAIL',
              reason: 'production hardening runtime integration failed',
            };
          }
          assertNoSecrets(report);
          await writeFile(outputPath, `${JSON.stringify(report, null, 2)}\n`, {
            encoding: 'utf8',
            mode: 0o440,
          });
          if (!passed) process.exitCode = 1;
          NODE

      - name: Run protected staging smoke
        env:
          STAGING_SMOKE_SESSION_TOKEN: ${{ secrets.STAGING_SMOKE_SESSION_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          yarn staging:smoke \
            --api-origin "$(cat "$RUNNER_TEMP/api-origin.txt")" \
            --admin-origin "$(cat "$RUNNER_TEMP/admin-origin.txt")" \
            --session-token-env STAGING_SMOKE_SESSION_TOKEN \
            --output "$RUNNER_TEMP/staging-artifacts/staging-smoke.json"

      - name: Record observed runtime and smoke evidence
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/staging-artifacts/check-results.json" \
            "$RUNNER_TEMP/staging-artifacts/runtime-integration.json" \
            "$RUNNER_TEMP/staging-artifacts/staging-smoke.json" \
            "$RUNNER_TEMP/staging.env" \
            "$(cat "$RUNNER_TEMP/release-version.txt")" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const [checksPath, runtimePath, smokePath, envPath, releaseId] =
            process.argv.slice(2);
          const env = Object.fromEntries(
            (await readFile(envPath, 'utf8'))
              .split(/\r?\n/)
              .map((line) => line.match(/^(POSTGRES_DB|MIGRATION_TARGET_SCHEMA)=(.*)$/))
              .filter(Boolean)
              .map(([, key, value]) => [key, value.replace(/^(['"])(.*)\1$/, '$2')]),
          );
          const target = {
            database: env.POSTGRES_DB,
            schema: env.MIGRATION_TARGET_SCHEMA,
          };
          const runtime = JSON.parse(await readFile(runtimePath, 'utf8'));
          if (runtime.result !== 'PASS') throw new Error('runtime integration did not PASS');
          const smoke = JSON.parse(await readFile(smokePath, 'utf8'));
          if (smoke.result !== 'PASS') throw new Error('staging smoke did not PASS');
          smoke.releaseId = releaseId;
          smoke.target = target;
          await writeFile(smokePath, `${JSON.stringify(smoke, null, 2)}\n`, 'utf8');
          const checks = JSON.parse(await readFile(checksPath, 'utf8'));
          checks.runtimeIntegration = 'PASS';
          checks.stagingSmoke = 'PASS';
          checks.security = 'PASS';
          checks.sbom = 'artifacts/deployed-image-sbom-index.json';
          checks.stagingSmokeReference = 'artifacts/staging-smoke.json';
          await writeFile(checksPath, `${JSON.stringify(checks, null, 2)}\n`, 'utf8');
          NODE

      - name: Generate the immutable release manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          : "${RELEASE_COMMIT:?exact reviewed release commit is required}"
          case "$RELEASE_COMMIT" in
            ''|*[!0-9a-fA-F]*)
              echo 'release commit must be hexadecimal' >&2
              exit 1
              ;;
          esac
          if [ "${#RELEASE_COMMIT}" -lt 7 ] || [ "${#RELEASE_COMMIT}" -gt 64 ]; then
            echo 'release commit length is invalid' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" || {
            echo 'checked-out commit does not match the reviewed release commit' >&2
            exit 1
          }
          yarn staging:manifest \
            --release-id "${{ needs.checks.outputs.release_id }}" \
            --commit "$RELEASE_COMMIT" \
            --images-json "$RUNNER_TEMP/images.json" \
            --checks-json "$RUNNER_TEMP/staging-artifacts/check-results.json" \
            --rollback-artifact "$(cat "$RUNNER_TEMP/rollback-artifact.txt")" \
            --output "$RUNNER_TEMP/staging-artifacts/release-manifest.json"

      - name: Include protected manifest inputs in uploaded evidence
        if: always()
        run: |
          test -f "$RUNNER_TEMP/images.json" && test ! -L "$RUNNER_TEMP/images.json"
          test -f "$RUNNER_TEMP/release-version.txt" && test ! -L "$RUNNER_TEMP/release-version.txt"
          install -m 0440 \
            "$RUNNER_TEMP/images.json" \
            "$RUNNER_TEMP/staging-artifacts/images.json"
          install -m 0440 \
            "$RUNNER_TEMP/release-version.txt" \
            "$RUNNER_TEMP/staging-artifacts/release-version.txt"

      - name: Upload protected staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ needs.checks.outputs.release_id }}
          path: ${{ runner.temp }}/staging-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Tear down disposable staging services
        if: always()
        run: >-
          docker compose --env-file "$RUNNER_TEMP/staging.env"
          -f docker-compose.yml -f docker-compose.staging.yml down
          --volumes --remove-orphans
