services:
  db:
    image: postgres:15-alpine
    command: ['postgres', '-c', 'password_encryption=md5']
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-CHANGE_ME_LOCAL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL}
      POSTGRES_DB: ${POSTGRES_DB:-imeal}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-CHANGE_ME_LOCAL} -d ${POSTGRES_DB:-imeal}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: imeal_pgbouncer
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER:-CHANGE_ME_LOCAL}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-imeal}
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    ports:
      - '${PGBOUNCER_PORT:-6432}:5432'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-CHANGE_ME_LOCAL} -d ${POSTGRES_DB:-imeal}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: imeal_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-CHANGE_ME_LOCAL}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_LOCAL}
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: quay.io/minio/mc:latest
    container_name: imeal_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-CHANGE_ME_LOCAL} ${MINIO_ROOT_PASSWORD:-CHANGE_ME_LOCAL};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-imeal-bucket} --ignore-existing;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_NAME:-imeal-bucket};
      exit 0;
      "

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    restart: 'no'
    command: ['yarn', 'workspace', '@imeal/core', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-CHANGE_ME_LOCAL}:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL}@db:5432/${POSTGRES_DB:-imeal}?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: imeal_api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_METRICS_TRANSPORT_URL: ${WORKER_METRICS_TRANSPORT_URL:-http://worker:3001/metrics/application-snapshot}
      WORKER_METRICS_TRANSPORT_TOKEN: ${WORKER_METRICS_TRANSPORT_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-CHANGE_ME_LOCAL}:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL}@pgbouncer:5432/${POSTGRES_DB:-imeal}?schema=public&pgbouncer=true
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-CHANGE_ME_LOCAL}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_LOCAL}
      AUTH_MODE: ${AUTH_MODE:-otp}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET is required}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
      OTP_DELIVERY_ENCRYPTION_KEY: ${OTP_DELIVERY_ENCRYPTION_KEY:?OTP_DELIVERY_ENCRYPTION_KEY is required}
      OTP_PROVIDER_URL: ${OTP_PROVIDER_URL:?OTP_PROVIDER_URL is required}
      OTP_PROVIDER_API_KEY: ${OTP_PROVIDER_API_KEY:?OTP_PROVIDER_API_KEY is required}
      OTP_PROVIDER_FROM: ${OTP_PROVIDER_FROM:?OTP_PROVIDER_FROM is required}
      OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:?OTP_EXPIRY_SECONDS is required}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:?OTP_RESEND_SECONDS is required}
      OTP_ATTEMPT_LIMIT: ${OTP_ATTEMPT_LIMIT:?OTP_ATTEMPT_LIMIT is required}
      OTP_RATE_WINDOW_SECONDS: ${OTP_RATE_WINDOW_SECONDS:?OTP_RATE_WINDOW_SECONDS is required}
      OTP_ADDRESS_RATE_LIMIT: ${OTP_ADDRESS_RATE_LIMIT:?OTP_ADDRESS_RATE_LIMIT is required}
      OTP_CLIENT_RATE_LIMIT: ${OTP_CLIENT_RATE_LIMIT:?OTP_CLIENT_RATE_LIMIT is required}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?SESSION_HASH_SECRET is required}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:?SESSION_IDLE_TIMEOUT_SECONDS is required}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:?SESSION_ABSOLUTE_TIMEOUT_SECONDS is required}
      GPS_DEFAULT_GEOFENCE_RADIUS_METERS: ${GPS_DEFAULT_GEOFENCE_RADIUS_METERS:?GPS_DEFAULT_GEOFENCE_RADIUS_METERS is required}
      GPS_DEFAULT_MAX_FIX_AGE_SECONDS: ${GPS_DEFAULT_MAX_FIX_AGE_SECONDS:?GPS_DEFAULT_MAX_FIX_AGE_SECONDS is required}
      GPS_DEFAULT_MAX_ACCURACY_METERS: ${GPS_DEFAULT_MAX_ACCURACY_METERS:?GPS_DEFAULT_MAX_ACCURACY_METERS is required}
      SERVING_TIME_ZONE: ${SERVING_TIME_ZONE:?SERVING_TIME_ZONE is required}
      SERVING_WINDOW_START: ${SERVING_WINDOW_START:?SERVING_WINDOW_START is required}
      SERVING_WINDOW_END: ${SERVING_WINDOW_END:?SERVING_WINDOW_END is required}
      NO_SHOW_PROCESSING_TIME: ${NO_SHOW_PROCESSING_TIME:?NO_SHOW_PROCESSING_TIME is required}
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: imeal_worker
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_METRICS_TRANSPORT_TOKEN: ${WORKER_METRICS_TRANSPORT_TOKEN:-}
      WORKER_METRICS_EVIDENCE_DIGEST: ${WORKER_METRICS_EVIDENCE_DIGEST:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-CHANGE_ME_LOCAL}:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL}@pgbouncer:5432/${POSTGRES_DB:-imeal}?schema=public&pgbouncer=true
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-CHANGE_ME_LOCAL}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_LOCAL}
      OTP_DELIVERY_ENCRYPTION_KEY: ${OTP_DELIVERY_ENCRYPTION_KEY:?OTP_DELIVERY_ENCRYPTION_KEY is required}
      OTP_PROVIDER_URL: ${OTP_PROVIDER_URL:?OTP_PROVIDER_URL is required}
      OTP_PROVIDER_API_KEY: ${OTP_PROVIDER_API_KEY:?OTP_PROVIDER_API_KEY is required}
      OTP_PROVIDER_FROM: ${OTP_PROVIDER_FROM:?OTP_PROVIDER_FROM is required}
      OTP_DELIVERY_BATCH_SIZE: ${OTP_DELIVERY_BATCH_SIZE:?OTP_DELIVERY_BATCH_SIZE is required}
      OTP_DELIVERY_MAX_ATTEMPTS: ${OTP_DELIVERY_MAX_ATTEMPTS:?OTP_DELIVERY_MAX_ATTEMPTS is required}
      OTP_DELIVERY_RETRY_BASE_SECONDS: ${OTP_DELIVERY_RETRY_BASE_SECONDS:?OTP_DELIVERY_RETRY_BASE_SECONDS is required}
      OTP_DELIVERY_RETRY_MAX_SECONDS: ${OTP_DELIVERY_RETRY_MAX_SECONDS:?OTP_DELIVERY_RETRY_MAX_SECONDS is required}
      OTP_DELIVERY_CLAIM_TIMEOUT_SECONDS: ${OTP_DELIVERY_CLAIM_TIMEOUT_SECONDS:?OTP_DELIVERY_CLAIM_TIMEOUT_SECONDS is required}
      SERVING_TIME_ZONE: ${SERVING_TIME_ZONE:?SERVING_TIME_ZONE is required}
      SERVING_WINDOW_START: ${SERVING_WINDOW_START:?SERVING_WINDOW_START is required}
      SERVING_WINDOW_END: ${SERVING_WINDOW_END:?SERVING_WINDOW_END is required}
      NO_SHOW_PROCESSING_TIME: ${NO_SHOW_PROCESSING_TIME:?NO_SHOW_PROCESSING_TIME is required}
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: imeal_admin_web
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: imeal_proxy
    restart: always
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
