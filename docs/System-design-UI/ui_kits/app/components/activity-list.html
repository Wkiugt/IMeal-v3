<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Component · Activity List</title>
    <link rel="stylesheet" href="../../../colors_and_type.css" />
    <style>
      body {
        background: color-mix(in oklch, var(--fg) 3%, var(--bg));
        padding: 32px;
      }
      .demo-frame {
        max-width: 420px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .activity-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 2px;
        border-bottom: 1px solid var(--border);
      }
      .activity-row:last-child {
        border-bottom: none;
      }
      .activity-icon {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-pill);
        background: var(--accent-tint);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .activity-icon img {
        width: 15px;
        height: 15px;
      }
      .activity-info {
        flex: 1 1 auto;
        min-width: 0;
      }
      .activity-title {
        font-size: 13.5px;
        font-weight: 600;
      }
      .activity-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
      }
      .activity-time {
        font-size: 11.5px;
        color: var(--muted);
        font-family: var(--font-mono);
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow" style="margin-bottom: 12px">COMPONENT · ACTIVITY LIST</p>
    <div class="demo-frame card">
      <!-- component-root: activity list rows, extracted verbatim from admin-dashboard.html -->
      <div id="component-root">
        <div class="activity-list">
          <div class="activity-row">
            <div class="activity-icon">
              <img src="../../../assets/icons/nav-calendar-menu.svg" alt="" />
            </div>
            <div class="activity-info">
              <p class="activity-title">Weekly menu published</p>
              <p class="activity-sub">Aug 24 – 28 · by Pham Quang</p>
            </div>
            <span class="activity-time">2h ago</span>
          </div>
          <div class="activity-row">
            <div class="activity-icon">
              <img src="../../../assets/icons/nav-penalties.svg" alt="" />
            </div>
            <div class="activity-info">
              <p class="activity-title">Penalty marked as paid</p>
              <p class="activity-sub">Ngoc Phuong · $9.00</p>
            </div>
            <span class="activity-time">5h ago</span>
          </div>
          <div class="activity-row">
            <div class="activity-icon">
              <img src="../../../assets/icons/nav-users.svg" alt="" />
            </div>
            <div class="activity-info">
              <p class="activity-title">New user added</p>
              <p class="activity-sub">Tran My · Design</p>
            </div>
            <span class="activity-time">1d ago</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
