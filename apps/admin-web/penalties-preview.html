<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Meal Admin · Penalties &amp; Invoicing (React Clone)</title>
    <style>
      :root {
        --bg: oklch(100% 0 0);
        --surface: oklch(100% 0 0);
        --fg: oklch(27% 0.025 255);
        --muted: oklch(44% 0.022 255);
        --border: oklch(92% 0.014 240);
        --accent: oklch(80% 0.085 250);

        --accent-deep: oklch(42% 0.135 250);
        --accent-soft: oklch(93% 0.035 250);
        --accent-tint: oklch(97% 0.016 250);
        --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent);
        --shadow-sm: 0 1px 2px color-mix(in oklch, var(--fg) 7%, transparent);
        --shadow-md: 0 10px 28px color-mix(in oklch, var(--fg) 10%, transparent);
        --shadow-lg: 0 20px 48px color-mix(in oklch, var(--fg) 14%, transparent);

        --status-good-tint: oklch(94% 0.05 155);
        --status-good-deep: oklch(38% 0.11 155);
        --status-warn-tint: oklch(95% 0.05 85);
        --status-warn-deep: oklch(42% 0.13 85);
        --status-bad-tint: oklch(94% 0.045 25);
        --status-bad-deep: oklch(40% 0.15 25);

        --font-body:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI',
          system-ui, sans-serif;
        --font-display:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI',
          system-ui, sans-serif;
        --font-mono:
          ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

        --radius-sm: 14px;
        --radius: 20px;
        --radius-lg: 28px;
        --radius-pill: 999px;

        --sidebar-w: 248px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: color-mix(in oklch, var(--fg) 3%, var(--bg));
        color: var(--fg);
        font-family: var(--font-body);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      img,
      svg {
        display: block;
      }
      button,
      a {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      button {
        background: none;
        border: none;
      }
      a {
        text-decoration: none;
      }
      p {
        margin: 0;
        text-wrap: pretty;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        text-wrap: balance;
        font-family: var(--font-display);
      }
      :focus-visible {
        outline: 2px solid var(--accent-deep);
        outline-offset: 2px;
        border-radius: 6px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
        }
      }

      /* ── shared building blocks ─────────────────────────────────────── */
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 24px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: var(--radius-pill);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
        flex: 0 0 auto;
      }
      .pill-soft {
        background: var(--accent-soft);
        color: var(--accent-deep);
      }
      .pill-outline {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .pill-solid {
        background: var(--accent-deep);
        color: var(--surface);
      }
      .pill-good {
        background: var(--status-good-tint);
        color: var(--status-good-deep);
      }
      .pill-warn {
        background: var(--status-warn-tint);
        color: var(--status-warn-deep);
      }
      .pill-bad {
        background: var(--status-bad-tint);
        color: var(--status-bad-deep);
      }
      .pill svg {
        width: 13px;
        height: 13px;
        flex: 0 0 auto;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-pill);
        background: var(--accent-soft);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        flex: 0 0 auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: var(--radius-pill);
        font-size: 13.5px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease,
          transform 0.08s ease;
        white-space: nowrap;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }
      .btn-primary {
        background: var(--accent-deep);
        color: var(--surface);
        box-shadow: var(--shadow-sm);
      }
      .btn-primary:hover {
        background: color-mix(in oklch, var(--accent-deep) 88%, black);
        box-shadow: var(--shadow-md);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        border-color: var(--muted);
        background: var(--fg-soft);
      }
      .btn-secondary:active {
        transform: scale(0.98);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        padding: 8px 10px;
        font-size: 12.5px;
      }
      .btn-ghost:hover {
        color: var(--fg);
        background: var(--fg-soft);
      }

      /* ── admin shell ────────────────────────────────────────────────── */
      .admin-shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: color-mix(in oklch, var(--fg) 45%, transparent);
        z-index: 30;
      }
      .sidebar-backdrop.visible {
        display: block;
      }
      .sidebar {
        position: sticky;
        top: 0;
        flex: 0 0 auto;
        width: var(--sidebar-w);
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 22px 16px;
        z-index: 40;
      }
      .sidebar-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 22px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        background: var(--accent-soft);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .brand-mark svg {
        width: 18px;
        height: 18px;
      }
      .brand-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15.5px;
        letter-spacing: -0.005em;
      }
      .sidebar-close {
        display: none;
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-pill);
        color: var(--muted);
      }
      .sidebar-close svg {
        width: 18px;
        height: 18px;
      }
      .sidebar-close:hover {
        color: var(--fg);
        background: var(--fg-soft);
      }
      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 auto;
      }
      .sidebar-nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .sidebar-nav-item svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      .sidebar-nav-item:hover {
        color: var(--fg);
        background: var(--fg-soft);
      }
      .sidebar-nav-item.active {
        color: var(--accent-deep);
        background: var(--accent-soft);
      }
      .sidebar-foot {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 10px 4px;
        border-top: 1px solid var(--border);
      }
      .sidebar-foot-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .sidebar-foot-name {
        font-weight: 700;
        font-size: 13.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar-foot-role {
        font-size: 12px;
        color: var(--muted);
      }

      .admin-main-wrap {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .admin-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 32px;
        background: color-mix(in oklch, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .topbar-menu-btn {
        display: none;
        width: 38px;
        height: 38px;
        border-radius: var(--radius-pill);
        color: var(--fg);
        flex: 0 0 auto;
      }
      .topbar-menu-btn svg {
        width: 20px;
        height: 20px;
      }
      .topbar-menu-btn:hover {
        background: var(--fg-soft);
      }
      .topbar-titles {
        flex: 1 1 auto;
        min-width: 0;
      }
      .topbar-titles h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin-top: 3px;
      }
      .topbar-profile {
        flex: 0 0 auto;
      }
      .admin-main {
        flex: 1 1 auto;
        padding: 28px 32px 56px;
        max-width: 1120px;
        width: 100%;
        margin: 0 auto;
      }

      @media (max-width: 900px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          transform: translateX(-100%);
          box-shadow: var(--shadow-lg);
          transition: transform 0.22s ease;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .sidebar-close {
          display: grid;
          place-items: center;
        }
        .topbar-menu-btn {
          display: grid;
          place-items: center;
        }
        .admin-topbar {
          padding: 16px 20px;
        }
        .admin-main {
          padding: 20px 20px 48px;
        }
      }
      @media (max-width: 560px) {
        .topbar-titles h1 {
          font-size: 19px;
        }
        .admin-main {
          padding: 16px 14px 40px;
        }
      }

      /* ── penalties 4-metric grid ────────────────────────────────────── */
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 26px;
      }
      .metric-card {
        background: linear-gradient(
          150deg,
          var(--accent-tint),
          var(--accent-soft)
        );
        border: 1px solid var(--accent-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 20px 22px;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .metric-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .metric-icon-wrap {
        width: 38px;
        height: 38px;
        border-radius: var(--radius);
        background: color-mix(in oklch, var(--surface) 60%, transparent);
        display: grid;
        place-items: center;
        margin-bottom: 12px;
      }
      .metric-icon-wrap svg {
        width: 19px;
        height: 19px;
        color: var(--accent-deep);
      }
      .metric-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }
      .metric-value {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: 6px;
      }
      .metric-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      /* ── section head & filters ────────────────────────────────────── */
      .section-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .section-head h2 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.005em;
      }
      .section-head p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
      }

      .filter-toolbar {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 16px 20px;
        box-shadow: var(--shadow-sm);
      }
      .filter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      .filter-pills {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter-pill-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: var(--radius-pill);
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .filter-pill-btn:hover {
        background: var(--accent-tint);
        color: var(--fg);
      }
      .filter-pill-btn.active {
        background: var(--accent-deep);
        color: var(--surface);
        border-color: var(--accent-deep);
      }
      .filter-pill-count {
        background: color-mix(in oklch, currentColor 15%, transparent);
        padding: 2px 7px;
        border-radius: var(--radius-pill);
        font-size: 11px;
      }

      .filter-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .search-box {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search-box svg {
        position: absolute;
        left: 12px;
        width: 15px;
        height: 15px;
        color: var(--muted);
        pointer-events: none;
      }
      .search-input {
        padding: 8px 14px 8px 34px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        font-size: 13px;
        outline: none;
        width: 220px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .search-input:focus {
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .date-group {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .date-input {
        padding: 7px 12px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        font-size: 12.5px;
        outline: none;
      }
      .date-input:focus {
        border-color: var(--accent-deep);
      }

      /* ── penalty list & cards ────────────────────────────────────────── */
      .penalty-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .penalty-card {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 18px 22px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        transition: border-color 0.15s ease;
      }
      .penalty-card:hover {
        border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
      }
      .penalty-info {
        flex: 1 1 240px;
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .penalty-name-block {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .penalty-name {
        font-weight: 700;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .penalty-dept {
        font-size: 12.5px;
        color: var(--muted);
      }
      .penalty-reason-tag {
        font-size: 11.5px;
        color: var(--accent-deep);
        background: var(--accent-tint);
        padding: 2px 8px;
        border-radius: 6px;
        display: inline-block;
        margin-top: 3px;
        width: fit-content;
      }
      .penalty-meta {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        min-width: 110px;
      }
      .penalty-amount {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 17px;
      }
      .penalty-meals {
        font-size: 12px;
        color: var(--muted);
      }
      .penalty-status {
        flex: 0 0 auto;
      }
      .penalty-action {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .empty-state {
        padding: 48px 24px;
        text-align: center;
        color: var(--muted);
        background: var(--surface);
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
      }
      .empty-state svg {
        width: 36px;
        height: 36px;
        margin: 0 auto 12px;
        opacity: 0.5;
      }

      /* ── modal dialog ───────────────────────────────────────────────── */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: color-mix(in oklch, var(--fg) 40%, transparent);
        backdrop-filter: blur(6px);
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 16px;
        animation: modalFadeIn 0.15s ease-out;
      }
      @keyframes modalFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        max-width: 480px;
        width: 100%;
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        animation: modalSlideUp 0.18s ease-out;
      }
      @keyframes modalSlideUp {
        from {
          transform: translateY(12px) scale(0.98);
        }
        to {
          transform: translateY(0) scale(1);
        }
      }
      .modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .modal-header h3 {
        font-size: 18px;
        font-weight: 700;
      }
      .modal-header p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .modal-close-btn {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-pill);
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .modal-close-btn:hover {
        background: var(--fg-soft);
        color: var(--fg);
      }
      .modal-penalty-summary {
        background: var(--accent-tint);
        border: 1px solid var(--accent-soft);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-penalty-name {
        font-weight: 700;
        font-size: 14px;
      }
      .modal-penalty-sub {
        font-size: 12px;
        color: var(--muted);
      }
      .modal-penalty-amount {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 16px;
        color: var(--accent-deep);
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-label {
        font-size: 13px;
        font-weight: 600;
      }
      .form-textarea {
        width: 100%;
        min-height: 90px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        padding: 10px 12px;
        font-family: var(--font-body);
        font-size: 13.5px;
        color: var(--fg);
        background: var(--surface);
        outline: none;
        resize: vertical;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .form-textarea:focus {
        border-color: var(--accent-deep);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .form-textarea.has-error {
        border-color: var(--status-bad-deep);
      }
      .form-hint-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
      }
      .form-error {
        color: var(--status-bad-deep);
        font-weight: 500;
      }
      .char-counter {
        color: var(--muted);
        margin-left: auto;
      }
      .modal-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 6px;
      }

      /* ── toast alert ────────────────────────────────────────────────── */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--fg);
        color: var(--surface);
        padding: 12px 20px;

      function WaiveModal({ penalty, isOpen, onClose, onConfirm }) {
        const [reason, setReason] = useState('');
        const [error, setError] = useState('');

        if (!isOpen || !penalty) return null;

        const handleConfirm = () => {
          if (!reason || reason.trim().length < 5) {
            setError('Waive reason must be at least 5 characters long.');
            return;
          }
          onConfirm(penalty.id, reason.trim());
          setReason('');
          setError('');
          onClose();
        };

        const handleReasonChange = (e) => {
          setReason(e.target.value);
          if (e.target.value.trim().length >= 5) {
            setError('');
          }
        };

        return (
          <div className="modal-backdrop" onClick={onClose}>
            <div className="modal-box" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <div>
                  <h3>Waive Penalty</h3>
                  <p>Provide an official justification to exempt this user.</p>
                </div>
                <button
                  className="modal-close-btn"
                  onClick={onClose}
                  aria-label="Close"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    style={{ width: 18, height: 18 }}
                  >
                    <path d="M18 6 6 18M6 6l12 12" />
                  </svg>
                </button>
              </div>

                  <div className="modal-penalty-sub">
                    {penalty.userDepartment} · {penalty.reason}

                <div className="modal-penalty-amount">

              </div>

              <div className="form-field">
                <label className="form-label" htmlFor="waiveReasonInput">
                  Exemption Reason (Min. 5 characters) *
                </label>
                <textarea
                  id="waiveReasonInput"
                  className={`form-textarea ${error ? 'has-error' : ''}`}
                  placeholder="e.g. Approved medical leave certificate / emergency business travel"
                  value={reason}
                  onChange={handleReasonChange}
                  autoFocus
                />
                <div className="form-hint-row">
                  {error ? (
                    <span className="form-error">{error}</span>
                  ) : (
                    <span style={{ color: 'var(--muted)' }}>
                      Required for audit compliance
                    </span>
                  )}
                  <span className="char-counter">
                    {reason.trim().length} / 5 min
                  </span>
                </div>
              </div>

              <div className="modal-footer">
                <button className="btn btn-secondary" onClick={onClose}>
                  Cancel
                </button>
                <button
                  className="btn btn-primary"
                  onClick={handleConfirm}
                  disabled={reason.trim().length < 5}
                  style={{
                    opacity: reason.trim().length < 5 ? 0.6 : 1,
                    cursor:
                      reason.trim().length < 5 ? 'not-allowed' : 'pointer',
                  }}
                >

        );

      function App() {

        const [endDate, setEndDate] = useState('');
        const [waiveTarget, setWaiveTarget] = useState(null);
        const [toastMessage, setToastMessage] = useState('');

        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(''), 3200);
        };

        // Handlers
        const handleMarkPaid = (id) => {
          setPenalties((prev) =>
            prev.map((p) => {
              if (p.id === id) {
                return {
                  ...p,
                  status: 'PAID',
                  paidAt: new Date().toISOString(),
                  updatedAt: new Date().toISOString(),
                };
              }
              return p;
            }),
          );
          showToast('Penalty successfully marked as PAID');
        };

        const handleWaiveConfirm = (id, waiveReason) => {
          setPenalties((prev) =>
            prev.map((p) => {
              if (p.id === id) {
                return {
                  ...p,
                  status: 'WAIVED',
                  waivedAt: new Date().toISOString(),
                  waiveReason,
                  waivedByUserId: 'admin-pq',
                  updatedAt: new Date().toISOString(),
                };
              }
              return p;
            }),
          );
          showToast('Penalty successfully WAIVED with audit reason');
        };

        // 4 Dynamic Metrics calculation
        const metrics = useMemo(() => {
          const totalInvoiced = penalties.reduce((acc, p) => acc + p.amount, 0);
          const pendingPenalties = penalties.filter(
            (p) => p.status === 'PENDING',
          );
          const paidPenalties = penalties.filter((p) => p.status === 'PAID');
          const waivedPenalties = penalties.filter(
            (p) => p.status === 'WAIVED',
          );

          const outstandingAmount = pendingPenalties.reduce(
            (acc, p) => acc + p.amount,
            0,
          );
          const paidAmount = paidPenalties.reduce(
            (acc, p) => acc + p.amount,
            0,
          );
          const waivedAmount = waivedPenalties.reduce(
            (acc, p) => acc + p.amount,
            0,
          );

          return {
            totalInvoiced,
            outstandingAmount,
            paidAmount,
            waivedAmount,
            totalCount: penalties.length,
            pendingCount: pendingPenalties.length,
            paidCount: paidPenalties.length,
            waivedCount: waivedPenalties.length,
          };
        }, [penalties]);

        // Filtered penalties list
        const filteredPenalties = useMemo(() => {
          return penalties.filter((p) => {
            // Status filter
            if (activeFilter !== 'ALL' && p.status !== activeFilter) {
              return false;
            }
            // Search filter
            if (searchTerm.trim() !== '') {
              const term = searchTerm.toLowerCase();
              const matchName = p.userName?.toLowerCase().includes(term);
              const matchEmail = p.userEmail?.toLowerCase().includes(term);
              const matchDept = p.userDepartment?.toLowerCase().includes(term);
              const matchReason = p.reason?.toLowerCase().includes(term);
              if (!matchName && !matchEmail && !matchDept && !matchReason) {
                return false;
              }
            }
            // Date filter
            if (startDate) {
              const pDate = p.createdAt.split('T')[0];
              if (pDate < startDate) return false;
            }
            if (endDate) {
              const pDate = p.createdAt.split('T')[0];
              if (pDate > endDate) return false;
            }
            return true;
          });
        }, [penalties, activeFilter, searchTerm, startDate, endDate]);

        return (

              isOpen={isSidebarOpen}
              onClose={() => setSidebarOpen(false)}

                      </svg>
                    }
                  />
                  <MetricCard
                    id="metric-waived-exceptions"
                    label="Waived Exceptions"
                    value={formatMoney(metrics.waivedAmount)}
                    sub={`${metrics.waivedCount} excused cases`}
                    iconSvg={
                      <svg

                        stroke="currentColor"
                        strokeWidth="1.6"
                        strokeLinecap="round"
                        strokeLinejoin="round"

                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
                        <path d="m9 12 2 2 4-4" />
                      </svg>
                    }
                  />
                  <MetricCard

                        strokeWidth="1.6"

                        strokeLinejoin="round"
                      >
                        <path d="M5 12.5 10 17.5 19 6.5" />

                    }
                  />
                </div>

                {/* 2. Section Header & Filter Toolbar */}

                      <div className="date-group">
                        <span>To:</span>
                        <input
                          type="date"
                          className="date-input"
                          value={endDate}
                          onChange={(e) => setEndDate(e.target.value)}
                        />
                      </div>

                      {(searchTerm ||
                        startDate ||
                        endDate ||
                        activeFilter !== 'ALL') && (
                        <button
                          className="btn btn-ghost"
                          onClick={() => {
                            setSearchTerm('');
                            setStartDate('');
                            setEndDate('');
                            setActiveFilter('ALL');
                          }}
                        >
                          Clear
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* 3. Penalty Items List */}
                <div className="penalty-list" data-od-id="penalty-list">
                  {filteredPenalties.length === 0 ? (
                    <div className="empty-state">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="1.6"
                      >
                        <circle cx="12" cy="12" r="10" />
                        <path d="m15 9-6 6M9 9l6 6" />
                      </svg>
                      <p>No penalties found matching current filters.</p>
                    </div>
                  ) : (
                    filteredPenalties.map((item) => (
                      <div
                        key={item.id}
                        className="penalty-card"
                        data-od-id={`penalty-${item.id}`}
                      >
                        <div className="penalty-info">
                          <div className="avatar">
                            {getInitials(item.userName)}
                          </div>
                          <div className="penalty-name-block">
                            <span className="penalty-name">
                              {item.userName}
                            </span>
                            <span className="penalty-dept">
                              {item.userDepartment} · {item.userEmail}
                            </span>
                            <span className="penalty-reason-tag">
                              {item.reason}
                            </span>
                          </div>
                        </div>

                        <div className="penalty-meta">
                          <span className="penalty-amount">
                            {formatMoney(item.amount)}
                          </span>
                          <span className="penalty-meals">
                            {item.createdAt.split('T')[0]}
                          </span>
                        </div>

                        <div className="penalty-status">
                          {item.status === 'PENDING' && (
                            <span className="pill pill-warn">
                              <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2"
                              >
                                <circle cx="12" cy="12" r="10" />
                                <line x1="12" y1="8" x2="12" y2="12" />
                                <line x1="12" y1="16" x2="12.01" y2="16" />
                              </svg>
                              Pending
                            </span>
                          )}
                          {item.status === 'PAID' && (
                            <span className="pill pill-good">
                              <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2"
                              >
                                <path d="M20 6 9 17l-5-5" />
                              </svg>
                              Paid
                            </span>
                          )}
                          {item.status === 'WAIVED' && (
                            <span
                              className="pill pill-soft"
                              title={item.waiveReason}
                            >
                              <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2"
                              >
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
                                <path d="m9 12 2 2 4-4" />
                              </svg>
                              Waived
                            </span>
                          )}
                        </div>

                        <div className="penalty-action">
                          {item.status === 'PENDING' && (
                            <React.Fragment>
                              <button
                                className="btn btn-primary"
                                onClick={() => handleMarkPaid(item.id)}
                              >
                                <svg
                                  viewBox="0 0 20 20"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="1.8"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                >
                                  <path d="M4.5 10.5 8 14l7.5-7.5" />
                                </svg>
                                Mark Paid
                              </button>
                              <button
                                className="btn btn-secondary"
                                onClick={() => setWaiveTarget(item)}
                              >
                                <svg
                                  viewBox="0 0 20 20"
                                  fill="none"
                                  stroke="currentColor"
                                  strokeWidth="1.8"
                                  strokeLinecap="round"
                                  strokeLinejoin="round"
                                >
                                  <path d="M10 2a8 8 0 1 0 8 8 8 8 0 0 0-8-8Zm0 4v4m0 4h.01" />
                                </svg>
                                Waive
                              </button>
                            </React.Fragment>
                          )}

                          {item.status === 'PAID' && (
                            <span
                              style={{
                                fontSize: '12px',
                                color: 'var(--status-good-deep)',
                                fontWeight: 500,
                              }}
                            >
                              Paid at{' '}
                              {item.paidAt
                                ? item.paidAt.split('T')[0]
                                : 'Recorded'}
                            </span>
                          )}

                          {item.status === 'WAIVED' && (
                            <span
                              style={{
                                fontSize: '12px',
                                color: 'var(--muted)',
                                maxWidth: '180px',
                                overflow: 'hidden',
                                textOverflow: 'ellipsis',
                                whiteSpace: 'nowrap',
                              }}
                              title={item.waiveReason}
                            >
                              Reason: {item.waiveReason}
                            </span>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </main>
            </div>

            {/* Waive Reason Modal with Validation */}
            <WaiveModal
              penalty={waiveTarget}
              isOpen={Boolean(waiveTarget)}
              onClose={() => setWaiveTarget(null)}
              onConfirm={handleWaiveConfirm}
            />

            {/* Toast Notification */}
            {toastMessage && (
              <div className="toast">
                <svg
                  viewBox="0 0 20 20"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  style={{ width: 18, height: 18 }}
                >
                  <circle cx="10" cy="10" r="8" />
                  <path d="m7 10 2 2 4-4" />
                </svg>
                {toastMessage}
              </div>
            )}
          </div>
        );
      }

      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        render() {
          if (this.state.hasError) {
            return (
              <div style={{ padding: 20, color: 'red' }}>
                <h2>Something went wrong in the preview.</h2>
                <pre>{this.state.error.toString()}</pre>
              </div>
            );
          }
          return this.props.children;
        }
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>,
      );
    </script>
  </body>
</html>
