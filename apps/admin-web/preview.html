<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Meal Admin · Dashboard (React Clone)</title>
    <style>
      :root {
        --bg: oklch(100% 0 0);
        --surface: oklch(100% 0 0);
        --fg: oklch(27% 0.025 255);
        --muted: oklch(44% 0.022 255);
        --border: oklch(92% 0.014 240);
        --accent: oklch(80% 0.085 250);

        --accent-deep: oklch(42% 0.135 250);
        --accent-soft: oklch(93% 0.035 250);
        --accent-tint: oklch(97% 0.016 250);
        --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent);
        --shadow-sm: 0 1px 2px color-mix(in oklch, var(--fg) 7%, transparent);
        --shadow-md: 0 10px 28px color-mix(in oklch, var(--fg) 10%, transparent);
        --shadow-lg: 0 20px 48px color-mix(in oklch, var(--fg) 14%, transparent);

        --status-good-tint: oklch(94% 0.05 155);
        --status-good-deep: oklch(38% 0.11 155);
        --status-warn-tint: oklch(95% 0.05 85);
        --status-warn-deep: oklch(42% 0.13 85);
        --status-bad-tint: oklch(94% 0.045 25);
        --status-bad-deep: oklch(40% 0.15 25);

        --font-body:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI',
          system-ui, sans-serif;
        --font-display:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI',
          system-ui, sans-serif;
        --font-mono:
          ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

        --radius-sm: 14px;
        --radius: 20px;
        --radius-lg: 28px;
        --radius-pill: 999px;

        --sidebar-w: 248px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: color-mix(in oklch, var(--fg) 3%, var(--bg));
        color: var(--fg);
        font-family: var(--font-body);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      img,
      svg {
        display: block;
      }
      button,
      a {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      button {
        background: none;
        border: none;
      }
      a {
        text-decoration: none;
      }
      p {
        margin: 0;
        text-wrap: pretty;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        text-wrap: balance;
        font-family: var(--font-display);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid var(--accent-deep);
        outline-offset: 2px;
        border-radius: 6px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
        }
      }

      /* ── shared building blocks ─────────────────────────────────────── */
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 24px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: var(--radius-pill);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
        flex: 0 0 auto;
      }
      .pill-soft {
        background: var(--accent-soft);
        color: var(--accent-deep);
      }
      .pill-outline {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .pill-solid {
        background: var(--accent-deep);
        color: var(--surface);
      }
      .pill-good {
        background: var(--status-good-tint);
        color: var(--status-good-deep);
      }
      .pill-warn {
        background: var(--status-warn-tint);
        color: var(--status-warn-deep);
      }
      .pill-bad {
        background: var(--status-bad-tint);
        color: var(--status-bad-deep);
      }
      .pill svg {
        width: 13px;
        height: 13px;
        flex: 0 0 auto;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-pill);
        background: var(--accent-soft);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        flex: 0 0 auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 20px;
        border-radius: var(--radius-pill);
        font-size: 14px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease,
          transform 0.08s ease;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }
      .btn-primary {
        background: var(--accent-deep);
        color: var(--surface);
        box-shadow: var(--shadow-sm);
      }
      .btn-primary:hover {
        background: color-mix(in oklch, var(--accent-deep) 88%, black);
        box-shadow: var(--shadow-md);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        border-color: var(--muted);
        background: var(--fg-soft);
      }
      .btn-secondary:active {
        transform: scale(0.98);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        padding: 8px 12px;
        font-size: 13px;
      }
      .btn-ghost:hover {
        color: var(--fg);
        background: var(--fg-soft);
      }
      .btn-icon {
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: var(--radius-pill);
        color: var(--muted);
        border: 1px solid var(--border);
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
      }
      .btn-icon svg {
        width: 16px;
        height: 16px;
      }
      .btn-icon:hover {
        color: var(--fg);
        border-color: var(--muted);
        background: var(--fg-soft);
      }
      .btn-icon.danger:hover {
        color: var(--status-bad-deep);
        border-color: color-mix(
          in oklch,
          var(--status-bad-deep) 35%,
          var(--border)
        );
        background: var(--status-bad-tint);
      }

      /* ── admin shell ────────────────────────────────────────────────── */
      .admin-shell {
        display: flex;
        min-height: 100vh;
      }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: color-mix(in oklch, var(--fg) 45%, transparent);
        z-index: 30;
      }
      .sidebar-backdrop.visible {
        display: block;
      }

      .sidebar {
        position: sticky;
        top: 0;
        flex: 0 0 auto;
        width: var(--sidebar-w);
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 22px 16px;
        z-index: 40;
      }
      .sidebar-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 22px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        background: var(--accent-soft);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .brand-mark svg {
        width: 18px;
        height: 18px;
      }
      .brand-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15.5px;
        letter-spacing: -0.005em;
      }
      .sidebar-close {
        display: none;
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-pill);
        color: var(--muted);
      }
      .sidebar-close svg {
        width: 18px;
        height: 18px;
      }
      .sidebar-close:hover {
        color: var(--fg);
        background: var(--fg-soft);
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1 1 auto;
      }
      .sidebar-nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border-radius: var(--radius);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .sidebar-nav-item svg {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
      }
      .sidebar-nav-item:hover:not(.active) {
        color: var(--fg);
        background: var(--fg-soft);
      }
      .sidebar-nav-item.active {
        color: var(--accent-deep);
        background: var(--accent-soft);
      }

      .sidebar-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        margin-top: 12px;
        border-top: 1px solid var(--border);
        padding-top: 18px;
      }
      .sidebar-foot-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .sidebar-foot-name {
        font-size: 13.5px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sidebar-foot-role {
        font-size: 12px;
        color: var(--muted);
      }

      .admin-main-wrap {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .admin-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 32px;
        background: color-mix(in oklch, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .topbar-menu-btn {
        display: none;
        width: 38px;
        height: 38px;
        border-radius: var(--radius-pill);
        color: var(--fg);
        flex: 0 0 auto;
      }
      .topbar-menu-btn svg {
        width: 20px;
        height: 20px;
      }
      .topbar-menu-btn:hover {
        background: var(--fg-soft);
      }
      .topbar-titles {
        flex: 1 1 auto;
        min-width: 0;
      }
      .topbar-titles h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin-top: 3px;
      }
      .topbar-profile {
        flex: 0 0 auto;
      }

      .admin-main {
        flex: 1 1 auto;
        padding: 28px 32px 56px;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
      }

      @media (max-width: 900px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          transform: translateX(-100%);
          box-shadow: var(--shadow-lg);
          transition: transform 0.22s ease;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .sidebar-close {
          display: grid;
          place-items: center;
        }
        .topbar-menu-btn {
          display: grid;
          place-items: center;
        }
        .admin-topbar {
          padding: 16px 20px;
        }
        .admin-main {
          padding: 20px 20px 48px;
        }
      }
      @media (max-width: 560px) {
        .topbar-titles h1 {
          font-size: 19px;
        }
        .admin-main {
          padding: 16px 14px 40px;
        }
      }

      /* ── dashboard page ─────────────────────────────────────────────── */
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 18px;
        margin-bottom: 22px;
      }
      .metric-card {
        background: linear-gradient(
          150deg,
          var(--accent-tint),
          var(--accent-soft)
        );
        border: 1px solid var(--accent-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 22px 24px;
      }
      .metric-icon-wrap {
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        background: color-mix(in oklch, var(--surface) 60%, transparent);
        display: grid;
        place-items: center;
        margin-bottom: 14px;
      }
      .metric-icon-wrap svg {
        width: 20px;
        height: 20px;
        color: var(--accent-deep);
      }
      .metric-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }
      .metric-value {
        font-family: var(--font-display);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: 8px;
      }
      .metric-delta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--status-good-deep);
        font-weight: 600;
      }
      .metric-delta.flat {
        color: var(--muted);
      }
      .metric-delta svg {
        width: 13px;
        height: 13px;
      }

      .chart-card {
        margin-bottom: 22px;
      }
      .chart-card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 4px;
      }
      .chart-card-head h2 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.005em;
      }
      .chart-card-head p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .chart-svg-wrap {
        margin-top: 18px;
        width: 100%;
        overflow-x: auto;
      }
      .chart-svg-wrap svg {
        width: 100%;
        height: auto;
        min-width: 480px;
        display: block;
      }
      .chart-grid-line {
        stroke: var(--border);
        stroke-width: 1;
      }
      .chart-axis-label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        fill: var(--muted);
      }
      .chart-line {
        fill: none;
        stroke: var(--accent-deep);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chart-area {
        fill: var(--accent-deep);
        opacity: 0.08;
      }
      .chart-dot {
        fill: var(--accent-deep);
        stroke: var(--surface);
        stroke-width: 2;
      }
      .chart-value-label {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        fill: var(--accent-deep);
      }

      .two-col {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 16px;
      }
      .activity-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 2px;
        border-bottom: 1px solid var(--border);
      }
      .activity-row:last-child {
        border-bottom: none;
      }
      .activity-icon {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-pill);
        background: var(--accent-tint);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .activity-icon svg {
        width: 15px;
        height: 15px;
      }
      .activity-info {
        flex: 1 1 auto;
        min-width: 0;
      }
      .activity-title {
        font-size: 13.5px;
        font-weight: 600;
      }
      .activity-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
      }
      .activity-time {
        font-size: 11.5px;
        color: var(--muted);
        font-family: var(--font-mono);
        flex: 0 0 auto;
      }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function Sidebar({ isOpen, onClose }) {
        return (
          <React.Fragment>
            <div
              className={`sidebar-backdrop ${isOpen ? 'visible' : ''}`}
              id="sidebarBackdrop"
              onClick={onClose}
            ></div>
            <aside
              className={`sidebar ${isOpen ? 'open' : ''}`}
              id="sidebar"
              data-od-id="admin-sidebar"
            >
              <div className="sidebar-head">
                <div className="brand-mark" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <path d="M6 3v9a3 3 0 0 0 6 0V3M9 8.5V3" />
                    <path d="M17.5 3c-1.4 1.4-2 3-2 5.2 0 1.8.9 2.8 2 3.3V21" />
                  </svg>
                </div>
                <span className="brand-name">Meal Admin</span>
                <button
                  className="sidebar-close"
                  id="sidebarClose"
                  aria-label="Close menu"
                  onClick={onClose}
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                  >
                    <path d="M6 6l12 12M18 6L6 18" />
                  </svg>
                </button>
              </div>

              <nav className="sidebar-nav" data-od-id="admin-nav">
                <a
                  className="sidebar-nav-item active"
                  href="#"
                  data-od-id="nav-admin-dashboard"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <path d="M4 11.5 12 4l8 7.5" />
                    <path d="M6 10v8.5a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1V10" />
                  </svg>
                  <span>Dashboard</span>
                </a>
                <a
                  className="sidebar-nav-item"
                  href="#"
                  data-od-id="nav-admin-metrics"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <path d="M5 20V11" />
                    <path d="M12.5 20V4" />
                    <path d="M20 20v-8.5" />
                  </svg>
                  <span>Metrics & Data</span>
                </a>
                <a
                  className="sidebar-nav-item"
                  href="penalties-preview.html"
                  data-od-id="nav-admin-penalties"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <rect x="5" y="3" width="14" height="18" rx="2.4" />
                    <path d="M9 8.5h6M9 12h6M9 15.5h3.5" />
                  </svg>
                  <span>Penalties & Invoicing</span>
                </a>
                <a
                  className="sidebar-nav-item"
                  href="#"
                  data-od-id="nav-admin-users"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <circle cx="9.5" cy="8" r="3.2" />
                    <path d="M3.8 20c0-3.3 2.5-5.8 5.7-5.8s5.7 2.5 5.7 5.8" />
                    <circle cx="17.3" cy="8.7" r="2.4" />
                    <path d="M15.8 14.5c2.3.4 4 2.4 4 5.5" />
                  </svg>
                  <span>User Management</span>
                </a>
                <a
                  className="sidebar-nav-item"
                  href="#"
                  data-od-id="nav-admin-menu"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.8"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
                    <path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" />
                  </svg>
                  <span>Weekly Menu</span>
                </a>
              </nav>

              <div className="sidebar-foot" data-od-id="admin-identity">
                <div className="avatar">PQ</div>
                <div className="sidebar-foot-info">
                  <span className="sidebar-foot-name">Pham Quang</span>
                  <span className="sidebar-foot-role">Admin</span>
                </div>
              </div>
            </aside>
          </React.Fragment>
        );
      }

      function Topbar({ onOpenSidebar }) {
        return (
          <header className="admin-topbar" data-od-id="admin-topbar">
            <button
              className="topbar-menu-btn"
              id="sidebarOpen"
              aria-label="Open menu"
              onClick={onOpenSidebar}
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="1.8"
                strokeLinecap="round"
              >
                <path d="M4 7h16M4 12h16M4 17h16" />
              </svg>
            </button>
            <div className="topbar-titles">
              <p className="eyebrow">ADMIN · OVERVIEW</p>
              <h1>Dashboard</h1>
            </div>
            <div className="topbar-profile">
              <div className="avatar">PQ</div>
            </div>
          </header>
        );
      }

      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        render() {
          if (this.state.hasError) {
            return <div style={{padding: 20, color: 'red'}}>
              <h2>Something went wrong in the preview.</h2>
              <pre>{this.state.error.toString()}</pre>
            </div>;
          }
          return this.props.children;
        }
      }
