# Staging qualification prerequisite: approved edge WAF or rate-limit control must be provisioned and observed before promotion.
# The stock Caddy image does not provide the required edge rate-limit policy; keep this gate external and explicit.
groups:
# The worker aggregator emits no numeric series when a required source is stale,
# unknown, in collector failure, or missing. Existing category alerts therefore
# use absent() on the approved metric names instead of inventing state metrics.
  - name: imeal-staging-hardening
    rules:
      - alert: ImealApiReadinessFailure
        expr: sum(increase(imeal_http_requests_total{route="/health/ready",status=~"500|502|503|504"}[1m])) >= 2 or absent(imeal_http_requests_total{route="/health/ready"})
        for: 1m
        labels:
          severity: critical
          owner: on-call
        annotations:
          summary: IMeal API readiness is failing
          description: The API readiness check has failed for at least one minute.
          action: Inspect API, database, proxy, and the release gate before rollback.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealApiErrorRateHigh
        expr: sum(rate(imeal_http_requests_total{status=~"500|502|503|504"}[5m])) / clamp_min(sum(rate(imeal_http_requests_total[5m])), 1) > 0.05 or absent(imeal_http_requests_total)
        for: 5m
        labels:
          severity: critical
          owner: api
        annotations:
          summary: IMeal API 5xx rate exceeds 5 percent
          description: API server errors exceed the initial staging threshold.
          action: Inspect release and request IDs, then stop promotion if release-correlated.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(imeal_http_request_duration_seconds_bucket[10m]))) > 1 or absent(imeal_http_request_duration_seconds_bucket)
        for: 10m
        labels:
          severity: warning
          owner: api
        annotations:
          summary: IMeal API p95 latency exceeds one second
          description: Normal traffic p95 request latency exceeds the initial staging threshold.
          action: Inspect database locks, pool saturation, and provider calls.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealOtpBacklog
        expr: imeal_otp_outbox_oldest_age_seconds > 300 or (rate(imeal_otp_delivery_failures_total[5m]) / clamp_min(rate(imeal_otp_delivery_total[5m]), 1) > 0.05) or rate(imeal_otp_delivery_retries_total[5m]) > 10 or absent(imeal_otp_delivery_total) or absent(imeal_otp_delivery_retries_total) or absent(imeal_otp_delivery_failures_total) or absent(imeal_otp_outbox_oldest_age_seconds)
        for: 5m
        labels:
          severity: critical
          owner: worker
        annotations:
          summary: IMeal OTP outbox backlog or delivery pressure is high
          description: The oldest pending OTP delivery or delivery error pressure exceeds the staging threshold.
          action: Inspect provider availability, worker claims, retries, and terminal failures.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealWorkerStale
        expr: imeal_worker_job_last_success_timestamp_seconds < time() - 600 or imeal_worker_job_lag_seconds > 600 or sum(rate(imeal_worker_runs_total{status="success"}[10m])) == 0 or absent(imeal_worker_runs_total) or absent(imeal_worker_job_last_success_timestamp_seconds) or absent(imeal_worker_job_lag_seconds) or absent(imeal_worker_job_last_success_timestamp_seconds{job="otp_delivery"}) or absent(imeal_worker_job_last_success_timestamp_seconds{job="notification_dispatch"}) or absent(imeal_worker_job_last_success_timestamp_seconds{job="registration_reminder"}) or absent(imeal_worker_job_last_success_timestamp_seconds{job="pickup_reminder"}) or absent(imeal_worker_job_last_success_timestamp_seconds{job="cutoff_lock"}) or absent(imeal_worker_job_last_success_timestamp_seconds{job="pickup_session_cleanup"}) or absent(imeal_worker_job_last_success_timestamp_seconds{job="no_show"}) or absent(imeal_worker_job_lag_seconds{job="otp_delivery"}) or absent(imeal_worker_job_lag_seconds{job="notification_dispatch"}) or absent(imeal_worker_job_lag_seconds{job="registration_reminder"}) or absent(imeal_worker_job_lag_seconds{job="pickup_reminder"}) or absent(imeal_worker_job_lag_seconds{job="cutoff_lock"}) or absent(imeal_worker_job_lag_seconds{job="pickup_session_cleanup"}) or absent(imeal_worker_job_lag_seconds{job="no_show"})
        for: 10m
        labels:
          severity: critical
          owner: worker
        annotations:
          summary: IMeal worker job has no recent successful run
          description: A required worker job has missed its deadline plus the staging margin.
          action: Inspect the job run record and execute only a controlled audited retry.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealDatabaseCapacity
        expr: imeal_postgres_disk_usage_ratio > 0.80 or imeal_postgres_connection_usage_ratio > 0.80 or rate(imeal_postgres_transaction_errors_total[5m]) > 0 or rate(imeal_postgres_lock_waits_total[5m]) > 0 or absent(imeal_postgres_connection_usage_ratio) or absent(imeal_postgres_transaction_errors_total) or absent(imeal_postgres_lock_waits_total) or absent(imeal_postgres_disk_usage_ratio)
        for: 10m
        labels:
          severity: warning
          owner: dba
        annotations:
          summary: IMeal PostgreSQL capacity or contention is high
          description: PostgreSQL disk, connection, transaction, or lock pressure exceeds the staging threshold.
          action: Inspect disk, connection usage, lock waits, and active migrations.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealObjectStorageUnavailable
        expr: imeal_object_storage_capacity_bytes == 0 or rate(imeal_object_storage_errors_total[5m]) > 0 or absent(imeal_object_storage_capacity_bytes) or absent(imeal_object_storage_errors_total)
        for: 5m
        labels:
          severity: critical
          owner: operations
        annotations:
          summary: IMeal object storage is unavailable
          description: The private staging object-storage health check is failing.
          action: Inspect object storage health, private bucket policy, and data-network connectivity.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealBackupStale
        expr: imeal_backup_age_seconds > 93600 or imeal_backup_checksum_failures_total > 0 or imeal_restore_test_failures_total > 0 or absent(imeal_backup_age_seconds) or absent(imeal_backup_checksum_failures_total) or absent(imeal_restore_test_failures_total)
        for: 5m
        labels:
          severity: critical
          owner: dba
        annotations:
          summary: IMeal backup freshness or restore integrity gate failed
          description: The latest backup is older than 26 hours or an integrity/restore test failed.
          action: Block release and run the approved backup/restore investigation.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealSecurityBoundaryViolation
        expr: imeal_security_boundary_violations_total > 0 or absent(imeal_security_boundary_violations_total)
        for: 1m
        labels:
          severity: critical
          owner: operations
        annotations:
          summary: IMeal staging security boundary violation detected
          description: An internal port, HTTP bearer request, invalid certificate, or unexpected CORS origin was observed.
          action: Stop promotion immediately and preserve the redacted alert evidence.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealApplicationErrorSpike
        expr: rate(imeal_auth_attempts_total{result=~"failure|dependency_failure"}[5m]) > 0 or rate(imeal_serving_confirm_total{result=~"error|failure"}[5m]) > 0 or rate(imeal_idempotency_conflicts_total[5m]) > 0 or absent(imeal_auth_attempts_total) or absent(imeal_serving_confirm_total) or absent(imeal_idempotency_conflicts_total)
        for: 5m
        labels:
          severity: warning
          owner: api
        annotations:
          summary: IMeal application error pressure is elevated
          description: Authentication, serving confirmation, or idempotency conflict errors are sustained.
          action: Inspect request IDs and application error records before continuing promotion.
          alert_test_route: /internal/observability/alert-test

      - alert: ImealServingConfirmLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(imeal_serving_confirm_duration_seconds_bucket[10m]))) > 1 or absent(imeal_serving_confirm_duration_seconds_bucket)
        for: 10m
        labels:
          severity: warning
          owner: api
        annotations:
          summary: IMeal serving confirmation latency is high
          description: Serving confirmation p95 latency exceeds the initial staging threshold.
          action: Inspect database locks, provider calls, and serving confirmation records.
          alert_test_route: /internal/observability/alert-test
