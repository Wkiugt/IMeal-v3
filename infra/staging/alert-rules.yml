groups:
  - name: imeal-staging-hardening
    rules:
      - alert: ImealApiReadinessFailure
        expr: imeal_health_check_status{service="api",check="ready"} == 0
        for: 1m
        labels:
          severity: critical
          owner: on-call
        annotations:
          summary: IMeal API readiness is failing
          description: The API readiness check has failed for at least one minute.
          action: Inspect API, database, proxy, and the release gate before rollback.

      - alert: ImealApiErrorRateHigh
        expr: sum(rate(imeal_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(imeal_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
          owner: api
        annotations:
          summary: IMeal API 5xx rate exceeds 5 percent
          description: API server errors exceed the initial staging threshold.
          action: Inspect release and request IDs, then stop promotion if release-correlated.

      - alert: ImealApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(imeal_http_request_duration_seconds_bucket[10m]))) > 1
        for: 10m
        labels:
          severity: warning
          owner: api
        annotations:
          summary: IMeal API p95 latency exceeds one second
          description: Normal traffic p95 request latency exceeds the initial staging threshold.
          action: Inspect database locks, pool saturation, and provider calls.

      - alert: ImealOtpBacklog
        expr: imeal_otp_outbox_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: critical
          owner: worker
        annotations:
          summary: IMeal OTP outbox backlog is older than five minutes
          description: The oldest pending OTP delivery exceeds the staging threshold.
          action: Inspect provider availability, worker claims, retries, and terminal failures.

      - alert: ImealWorkerStale
        expr: imeal_worker_job_last_success_timestamp_seconds < time() - 600
        for: 10m
        labels:
          severity: critical
          owner: worker
        annotations:
          summary: IMeal worker job has no recent successful run
          description: A required worker job has missed its deadline plus the staging margin.
          action: Inspect the job run record and execute only a controlled audited retry.

      - alert: ImealDatabaseCapacity
        expr: imeal_postgres_disk_usage_ratio > 0.80 or imeal_postgres_pool_saturation_ratio > 0.80
        for: 10m
        labels:
          severity: warning
          owner: dba
        annotations:
          summary: IMeal PostgreSQL capacity or pool saturation is high
          description: PostgreSQL disk or connection pool pressure exceeds the staging threshold.
          action: Inspect disk, pool usage, lock waits, and active migrations.

      - alert: ImealObjectStorageUnavailable
        expr: imeal_object_storage_available == 0
        for: 5m
        labels:
          severity: critical
          owner: operations
        annotations:
          summary: IMeal object storage is unavailable
          description: The private staging object-storage health check is failing.
          action: Inspect MinIO health, private bucket policy, and data-network connectivity.

      - alert: ImealBackupStale
        expr: imeal_backup_age_seconds > 93600 or imeal_backup_checksum_failures_total > 0 or imeal_restore_test_failures_total > 0
        for: 5m
        labels:
          severity: critical
          owner: dba
        annotations:
          summary: IMeal backup freshness or restore integrity gate failed
          description: The latest backup is older than 26 hours or an integrity/restore test failed.
          action: Block release and run the approved backup/restore investigation.

      - alert: ImealSecurityBoundaryViolation
        expr: imeal_security_boundary_violations_total > 0
        for: 1m
        labels:
          severity: critical
          owner: operations
        annotations:
          summary: IMeal staging security boundary violation detected
          description: An internal port, HTTP bearer request, invalid certificate, or unexpected CORS origin was observed.
          action: Stop promotion immediately and preserve the redacted alert evidence.
